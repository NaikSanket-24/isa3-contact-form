<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | ISA3 Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <aside class="info">
      <h1>Let's talk</h1>
      <p>Have a question or feedback? Fill in the form and we'll get back to you soon.</p>
     
    </aside>

    <form id="contactForm" novalidate>
      <h2>Contact Form</h2>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required />
        <small class="error"></small>
      </div>

      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <small class="error"></small>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit number" maxlength="10" />
          <small class="error"></small>
        </div>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What is this about?" required />
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
        <small class="error"></small>
        <small class="counter"><span id="count">0</span>/500</small>
      </div>

      <button type="submit" id="submitBtn"><span class="btn-text">Send Message</span><span class="spinner"></span></button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
